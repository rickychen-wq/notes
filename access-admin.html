<!DOCTYPE html>
<html lang="zh-Hant" data-admin-only="true" data-admin-fallback="index.html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>開放權限</title>
<script>(function(){var t=null;try{t=localStorage.getItem('nx:theme');}catch(e){}if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#09090b;--label2:#3c3c4399;--label3:#3c3c434d;--sep:#3c3c4326;--fill:#78788014;--blue:#0a84ff;--green:#28a745;--red:#ff3b30;--accent:#7257e8;--tint:#efebff;--shadow:0 10px 30px rgba(27,22,48,.09)}html[data-theme="dark"]{--bg:#09090b;--card:#1c1c1f;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#78788038;--green:#30d158;--red:#ff453a;--accent:#b4a4ff;--tint:#2f2949;--shadow:0 12px 34px rgba(0,0,0,.42)}@media(prefers-color-scheme:dark){html:not([data-theme="light"]){--bg:#09090b;--card:#1c1c1f;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#78788038;--green:#30d158;--red:#ff453a;--accent:#b4a4ff;--tint:#2f2949;--shadow:0 12px 34px rgba(0,0,0,.42)}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue",sans-serif;font-size:17px;line-height:1.55;padding-bottom:calc(52px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}.bar{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 13px) 18px 8px}.bar a{color:var(--blue);text-decoration:none;font-size:15px;font-weight:700}main{max-width:760px;margin:0 auto;padding:0 16px}.hero{position:relative;overflow:hidden;padding:22px 20px 21px;border-radius:24px;background:linear-gradient(140deg,#5941c8,#9277f4);color:#fff;box-shadow:0 18px 42px rgba(89,65,200,.24)}.hero:after{content:"";position:absolute;right:-65px;bottom:-105px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.15)}.hero-row{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.16em;color:#ffffffb8;text-transform:uppercase}.hero h1{font-size:31px;line-height:1.1;letter-spacing:-.9px;margin:5px 0 7px}.lead{margin:0;color:#ffffffc7;font-size:13.5px}.back{position:relative;z-index:2;border:1px solid #ffffff40;border-radius:12px;background:#ffffff1f;color:#fff;padding:8px 10px;font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;margin:13px 0 10px;border-radius:15px;background:var(--fill);border:.5px solid var(--sep)}.tabs button{border:0;border-radius:11px;background:transparent;padding:10px 6px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.tabs button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 3px 9px #0000001f}.panel{background:var(--card);border:.5px solid var(--sep);border-radius:20px;box-shadow:var(--shadow);padding:17px;margin:10px 0}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.panel h2{margin:0;font-size:21px;letter-spacing:-.4px}.panel-copy{margin:4px 0 0;color:var(--label2);font-size:13px}.count{flex:0 0 auto;border-radius:999px;background:var(--tint);color:var(--accent);padding:5px 9px;font-size:11px;font-weight:850}.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:15px 0 10px;padding:9px 11px;border-radius:13px;background:var(--fill)}.tools strong{font-size:12px;color:var(--accent)}.tool-buttons{display:flex;gap:6px}.tool-buttons button{border:0;border-radius:9px;background:var(--card);padding:6px 9px;font:inherit;font-size:11px;font-weight:750;cursor:pointer}.user-list{overflow:hidden;border:.5px solid var(--sep);border-radius:16px}.user-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:11px;padding:12px;cursor:pointer;border-top:.5px solid var(--sep)}.user-row:first-child{border-top:0}.user-row:hover{background:var(--fill)}.user-avatar{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--tint);color:var(--accent);font-size:15px;font-weight:850}.user-copy{font-weight:750;min-width:0}.user-copy small{display:block;overflow:hidden;color:var(--label2);font-size:10px;font-weight:500;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}.user-row input{position:absolute;opacity:0;pointer-events:none}.fake-check{display:grid;place-items:center;width:24px;height:24px;border:1.5px solid var(--sep);border-radius:8px;color:transparent;font-size:14px;font-weight:900}.user-row input:checked~.fake-check{background:var(--accent);border-color:var(--accent);color:#fff}.button{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#674bd8,#8d73f4);color:#fff;font:inherit;font-weight:850;padding:13px;box-shadow:0 8px 18px rgba(114,87,232,.22);cursor:pointer}.button:disabled{opacity:.45}.notice{margin:9px 3px 0;color:var(--label2);font-size:12px}.notice.ok{color:var(--green)}.notice.bad{color:var(--red)}.loading{text-align:center;color:var(--label2);padding:28px 10px}.empty{text-align:center;color:var(--label2);font-size:13px;padding:25px 10px}footer{text-align:center;color:var(--label3);font-size:12px;padding:26px 10px 0}@media(max-width:520px){.hero-row{display:block}.back{position:absolute;right:0;top:0}.hero-copy{padding-right:105px}.panel-head{display:block}.count{display:inline-block;margin-top:9px}}
</style>
<link rel="stylesheet" href="app-shell.css">
<script src="auth-prelude.js"></script>
<script type="module" src="auth-gate.js"></script>
</head>
<body>
<div class="bar"><a href="index.html">◀ 首頁</a></div>
<main>
  <header class="hero"><div class="hero-row"><div class="hero-copy"><div class="eyebrow">Admin · Access Control</div><h1>開放權限</h1><p class="lead">選一份內容，再勾選要開放的帳號；六份內容可以各自設定。</p></div><a class="back" href="index.html">返回首頁</a></div></header>
  <div class="tabs" id="targetTabs"><button type="button" data-target="final" aria-pressed="true">段考前複習</button><button type="button" data-target="quick" aria-pressed="false">最終速讀</button><button type="button" data-target="morning" aria-pressed="false">明早練習</button><button type="button" data-target="vocab" aria-pressed="false">4500 A–Z</button><button type="button" data-target="book" aria-pressed="false">課本 A–Z</button><button type="button" data-target="cloze" aria-pressed="false">雜誌 60 題</button></div>
  <section class="panel"><div class="panel-head"><div><h2 id="targetTitle">段考前最後複習</h2><p class="panel-copy" id="targetCopy">化學 23・生物 27・英文 15</p></div><span class="count" id="permissionCount">0 位已選</span></div><div class="tools"><strong id="accountSummary">選擇開放對象</strong><div class="tool-buttons"><button id="selectAllUsers" type="button">全部選取</button><button id="clearUsers" type="button">全部清除</button></div></div><div class="user-list" id="permissionUsers"><div class="loading">正在載入帳號…</div></div><div class="notice" id="permissionNotice">儲存後，勾選的使用者就能從首頁看到這份內容。</div><button class="button" id="savePermission" type="button" disabled>儲存這份權限</button></section>
  <footer>只有管理員可以修改；六份內容的開放名單彼此獨立。</footer>
</main>
<script type="module">
import {collection,db,doc,getDoc,getDocs,serverTimestamp,updateDoc,waitForSession} from './firebase-core.js';
const $=id=>document.getElementById(id);
const TARGETS={final:{field:'finalReviewAllowedUids',title:'段考前最後複習',copy:'化學 23・生物 27・英文 15'},quick:{field:'quickReviewAllowedUids',title:'考前最終速讀',copy:'化學・生物・英文易錯重點'},morning:{field:'morningQuizAllowedUids',title:'明早考前練習',copy:'化學 5・生物 5・英文 5'},vocab:{field:'vocabAzAllowedUids',title:'4500 單字 A–Z',copy:'五回共 228 字與雙向測驗'},book:{field:'bookVocabAllowedUids',title:'課本 L1–L3 單字 A–Z',copy:'三課共 98 字與雙向測驗'},cloze:{field:'magClozeAllowedUids',title:'雜誌四回克漏字 60 題',copy:'U2・U4・U8・U10，共 12 組'}};
let target='final',session=null,usersLoaded=false;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initial=value=>Array.from(String(value||'？').trim())[0]||'？';
function userRow(user,checked){return '<label class="user-row"><span class="user-avatar">'+esc(initial(user.name))+'</span><input type="checkbox" data-uid="'+esc(user.id)+'" '+(checked?'checked':'')+'><span class="user-copy">'+esc(user.name||'未命名')+'<small>登入帳號 · UID '+esc(user.id)+'</small></span><span class="fake-check">✓</span></label>';}
function updateCount(){const count=$('permissionUsers').querySelectorAll('input[data-uid]:checked').length;$('permissionCount').textContent=count+' 位已選';}
function selectTarget(next){target=next;const item=TARGETS[target];$('targetTitle').textContent=item.title;$('targetCopy').textContent=item.copy;document.querySelectorAll('[data-target]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.target===target)));loadUsers();}
async function loadUsers(){usersLoaded=false;$('savePermission').disabled=true;$('permissionUsers').innerHTML='<div class="loading">正在載入帳號…</div>';try{if(session&&session.preview){$('permissionUsers').innerHTML=userRow({id:'preview-student',name:'測試同學'},false)+userRow({id:'preview-friend',name:'78歲純情老少女'},target==='cloze');usersLoaded=true;updateCount();$('savePermission').disabled=false;return;}const [userSnap,systemSnap]=await Promise.all([getDocs(collection(db,'users')),getDoc(doc(db,'settings','system'))]);const data=systemSnap.exists()?systemSnap.data():{},field=TARGETS[target].field,configured=Array.isArray(data[field]),allowed=new Set(configured?data[field]:[]),legacyCloze=target==='cloze'&&!configured;const users=userSnap.docs.map(snapshot=>({id:snapshot.id,...snapshot.data()})).filter(user=>user.role!=='admin').sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'zh-Hant'));$('permissionUsers').innerHTML=users.length?users.map(user=>userRow(user,allowed.has(user.id)||(legacyCloze&&String(user.nameKey||user.name||'').normalize('NFKC').trim().toLocaleLowerCase('zh-Hant')==='78歲純情老少女'))).join(''):'<div class="empty">目前沒有其他使用者。</div>';usersLoaded=true;updateCount();$('savePermission').disabled=false;}catch(error){console.error(error);$('permissionUsers').innerHTML='<div class="empty">帳號載入失敗，請重新整理後再試。</div>';}}
async function savePermission(){if(!usersLoaded)return;const button=$('savePermission');button.disabled=true;$('permissionNotice').className='notice';$('permissionNotice').textContent='正在儲存…';const allowed=Array.from($('permissionUsers').querySelectorAll('input[data-uid]:checked')).map(input=>input.dataset.uid);try{if(!session.preview)await updateDoc(doc(db,'settings','system'),{[TARGETS[target].field]:allowed,accessUpdatedAt:serverTimestamp()});$('permissionNotice').className='notice ok';$('permissionNotice').textContent='已儲存「'+TARGETS[target].title+'」，共開放給 '+allowed.length+' 位使用者。';}catch(error){console.error(error);$('permissionNotice').className='notice bad';$('permissionNotice').textContent='權限沒有儲存成功，請稍後再試。';}finally{button.disabled=false;}}
$('targetTabs').addEventListener('click',event=>{const button=event.target.closest('[data-target]');if(button)selectTarget(button.dataset.target);});$('permissionUsers').addEventListener('change',updateCount);$('selectAllUsers').onclick=()=>{$('permissionUsers').querySelectorAll('input[data-uid]').forEach(input=>{input.checked=true;});updateCount();};$('clearUsers').onclick=()=>{$('permissionUsers').querySelectorAll('input[data-uid]').forEach(input=>{input.checked=false;});updateCount();};$('savePermission').onclick=savePermission;
session=await waitForSession();const requested=new URLSearchParams(location.search).get('target');selectTarget(TARGETS[requested]?requested:'final');
</script>
</body>
</html>
