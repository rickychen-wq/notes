<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>學習歷史｜段考複習</title>
<link rel="stylesheet" href="account-pages.css"><link rel="stylesheet" href="app-shell.css">
<script>(function(){try{var t=localStorage.getItem('nx:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}})()</script>
<script src="auth-prelude.js"></script><script type="module" src="auth-gate.js"></script>
</head>
<body>
<div class="ambient"><i style="width:360px;height:360px;left:-110px;top:-130px;background:#0a84ff"></i><i style="width:320px;height:320px;right:-100px;top:40%;background:#af52de;animation-delay:2s"></i></div>
<div class="sitebar"><a href="me.html">◀ 回學習狀況</a><span class="sitebar__mark">HISTORY</span></div>
<main class="page">
  <section class="hero"><p class="eyebrow">學習歷史</p><h1 id="historyTitle">完整紀錄</h1><p class="lead">查看測驗、常錯英文與各科錯題。</p></section>
  <nav class="history-tabs" aria-label="歷史分類"><button type="button" data-view="attempts" aria-pressed="true">測驗歷史</button><button type="button" data-view="words" aria-pressed="false">常錯英文</button><button type="button" data-view="questions" aria-pressed="false">其他錯題</button></nav>
  <section data-panel="attempts"><h2 class="section-title">所有測驗</h2><div class="card rows" id="historyAttempts"><div class="loading"><span class="spinner"></span></div></div></section>
  <section data-panel="words" hidden><h2 class="section-title">英文單字分類</h2><div class="card rows" id="historyWords"><div class="loading"><span class="spinner"></span></div></div></section>
  <section data-panel="questions" hidden><h2 class="section-title">依科目分類</h2><div id="historyQuestions"><div class="card loading"><span class="spinner"></span></div></div></section>
</main>
<dialog class="detail-dialog" id="detailDialog"><div class="detail-dialog__head"><h2 id="detailTitle">詳細內容</h2><button id="detailClose" type="button" aria-label="關閉">×</button></div><div class="detail-dialog__body" id="detailBody"></div></dialog>
<script type="module" src="history.js"></script>
</body>
</html>
