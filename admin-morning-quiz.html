<!DOCTYPE html>
<html lang="zh-Hant" data-admin-only="true" data-access-key="morningQuizAllowedUids" data-admin-fallback="index.html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>明早考前練習</title>
<script>(function(){var t=null;try{t=localStorage.getItem('nx:theme');}catch(e){}if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#09090b;--label2:#3c3c4399;--label3:#3c3c434d;--sep:#3c3c4326;--fill:#78788014;--blue:#0a84ff;--green:#28a745;--red:#ff3b30;--accent:#7257e8;--tint:#efebff;--shadow:0 10px 30px rgba(27,22,48,.09)}html[data-theme="dark"]{--bg:#09090b;--card:#1c1c1f;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#78788038;--green:#30d158;--red:#ff453a;--accent:#b4a4ff;--tint:#2f2949;--shadow:0 12px 34px rgba(0,0,0,.42)}@media(prefers-color-scheme:dark){html:not([data-theme="light"]){--bg:#09090b;--card:#1c1c1f;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#78788038;--green:#30d158;--red:#ff453a;--accent:#b4a4ff;--tint:#2f2949;--shadow:0 12px 34px rgba(0,0,0,.42)}}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue",sans-serif;font-size:17px;line-height:1.55;padding-bottom:calc(50px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}.ambient i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.16;width:330px;height:330px}.ambient i:first-child{background:#7257e8;left:-180px;top:-100px}.ambient i:last-child{background:#2f8d75;right:-180px;top:55%}.bar{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 13px) 18px 8px}.bar a{color:var(--blue);text-decoration:none;font-size:15px;font-weight:700}main{max-width:760px;margin:0 auto;padding:0 16px}.hero{position:relative;overflow:hidden;margin-bottom:13px;padding:21px 19px;border-radius:24px;background:linear-gradient(140deg,#5941c8,#9277f4);color:#fff;box-shadow:0 18px 42px rgba(89,65,200,.24)}.hero:after{content:"";position:absolute;right:-65px;bottom:-105px;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.15)}.hero-row{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.15em;color:#ffffffb8;text-transform:uppercase}.hero h1{font-size:31px;line-height:1.1;letter-spacing:-.9px;margin:5px 0 7px}.lead{margin:0;color:#ffffffc7;font-size:13px}.control{position:relative;z-index:2;border:1px solid #ffffff40;border-radius:12px;background:#ffffff1f;color:#fff;padding:8px 10px;font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;margin-bottom:12px;border-radius:15px;background:var(--fill);border:.5px solid var(--sep)}.tabs button{border:0;border-radius:11px;background:transparent;padding:9px 6px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.tabs button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 3px 9px #0000001f}.panel{background:var(--card);border:.5px solid var(--sep);border-radius:20px;box-shadow:var(--shadow);padding:17px;margin:10px 0}.progress{display:flex;justify-content:space-between;color:var(--label2);font-size:12px;font-weight:750}.track{height:6px;margin-top:8px;border-radius:99px;background:var(--fill);overflow:hidden}.track i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .25s ease}.unit{color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.04em}.question{font-size:21px;line-height:1.4;font-weight:850;letter-spacing:-.3px;margin-top:5px}.choices{display:grid;gap:9px;margin-top:15px}.choice{display:flex;gap:10px;align-items:flex-start;border:.5px solid var(--sep);border-radius:14px;background:var(--fill);padding:12px 13px;text-align:left;cursor:pointer;line-height:1.4}.choice b{flex:0 0 24px;color:var(--accent)}.choice.correct{border-color:var(--green);background:#28a74518}.choice.wrong{border-color:var(--red);background:#ff3b3018}.choice:disabled{opacity:1;color:var(--label)}.explain{margin-top:14px;padding:12px 13px;border-left:4px solid var(--green);border-radius:0 14px 14px 0;background:var(--fill)}.explain.bad{border-left-color:var(--red)}.verdict{font-weight:850;color:var(--green)}.bad .verdict{color:var(--red)}.answer{font-weight:850;margin-top:3px}.why{margin-top:8px;color:var(--label2);font-size:14px}.trap{margin-top:8px;padding:8px 10px;border-radius:10px;background:#c8912b18;color:var(--label2);font-size:13px}.trap b{color:#a4771e}.bigbtn{display:block;width:100%;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:850;padding:13px 16px;margin-top:13px;cursor:pointer}.bigbtn.sec{background:var(--fill);color:var(--label)}.next-hint{text-align:center;color:var(--label3);font-size:11px;margin-top:7px}.score{text-align:center;padding:25px 10px}.score-label{color:var(--accent);font-size:13px;font-weight:850}.score-big{font-size:64px;line-height:1;font-weight:900;letter-spacing:-2px;margin-top:6px}.score-line{color:var(--label2);font-size:14px;margin-top:8px}.wrong-title{font-size:13px;color:var(--label2);font-weight:850;margin:22px 2px 8px}.wrong{padding:12px 1px;border-bottom:.5px solid var(--sep)}.wrong:last-child{border-bottom:0}.wrong b{display:block}.wrong span{display:block;color:var(--label2);font-size:13px;margin-top:3px}.wrong .mine{color:var(--red)}footer{text-align:center;color:var(--label3);font-size:12px;padding:28px 10px 0}@media(max-width:450px){.hero h1{font-size:28px}.hero-row{display:block}.control{position:absolute;right:0;top:0}.hero-copy{padding-right:104px}.question{font-size:19px}}
</style>
<link rel="stylesheet" href="app-shell.css"><script src="auth-prelude.js"></script><script type="module" src="auth-gate.js"></script>
</head>
<body><div class="ambient"><i></i><i></i></div><div class="bar"><a href="index.html">◀ 首頁</a></div><main>
  <header class="hero"><div class="hero-row"><div class="hero-copy"><div class="eyebrow">Morning Drill · 15 Questions</div><h1>明早考前練習</h1><p class="lead">每科 5 題，先自己寫，再看解析；不會直接跳過也沒關係。</p></div><a id="permissionLink" class="control" href="access-admin.html?target=morning" hidden>＋ 開放權限</a></div></header>
  <div class="tabs" id="tabs"><button type="button" data-subject="chemistry" aria-pressed="true">化學 5</button><button type="button" data-subject="biology" aria-pressed="false">生物 5</button><button type="button" data-subject="english" aria-pressed="false">英文 5</button></div>
  <section id="setup" class="panel"><div class="progress"><span>明早練習版</span><span>每科 5 題</span></div><p class="lead" style="color:var(--label2);margin-top:8px">選一科開始。每題作答後會顯示完整原因和最容易被騙的地方。</p><button class="bigbtn" id="startBtn" type="button">開始化學 5 題</button></section>
  <section id="quiz" hidden><div class="panel"><div class="progress"><span id="progressText">第 1 / 5 題</span><span id="scoreText">答對 0 / 0</span></div><div class="track"><i id="progressBar"></i></div><div class="unit" id="unitText" style="margin-top:17px"></div><div class="question" id="questionText"></div><div class="choices" id="choices"></div><div class="explain" id="explain" hidden><div class="verdict" id="verdict"></div><div class="answer" id="answer"></div><div class="why" id="why"></div><div class="trap"><b>最容易錯：</b><span id="trap"></span></div></div><button class="bigbtn" id="nextBtn" type="button" hidden>下一題</button><div class="next-hint" id="nextHint" hidden>也可以按 Enter 繼續</div></div></section>
  <section id="result" hidden><div class="panel score"><div class="score-label" id="resultLabel"></div><div class="score-big" id="rScore">0%</div><div class="score-line" id="rLine">0 / 5 題答對</div></div><button class="bigbtn" id="retryBtn" type="button">再做一次</button><button class="bigbtn sec" id="changeBtn" type="button">換另一科</button><div class="wrong-title">這次的錯題解析</div><div class="panel" id="rWrong"></div></section>
  <footer>明早先寫這份，再回頭看「考前最終速讀」；不要一開始就偷看答案。</footer>
</main>
<script type="module">
import {MORNING_QUIZ_BANK} from './admin-morning-quiz-data.js';
import {waitForSession} from './firebase-core.js';
const $=id=>document.getElementById(id),letters=['A','B','C','D'],scoreIds={chemistry:'chem-morning-quiz',biology:'bio-morning-quiz',english:'en-morning-quiz'};
let subject='chemistry',questions=[],index=0,right=0,wrong=[],locked=false;
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function choose(value){subject=value;document.documentElement.style.setProperty('--accent',MORNING_QUIZ_BANK[value].accent);document.querySelectorAll('[data-subject]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.subject===value)));$('startBtn').textContent='開始'+MORNING_QUIZ_BANK[value].label+' 5 題';}
function start(){questions=MORNING_QUIZ_BANK[subject].questions.slice();index=0;right=0;wrong=[];locked=false;$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;render();window.scrollTo({top:0});}
function render(){const item=questions[index];locked=false;$('progressText').textContent='第 '+(index+1)+' / 5 題';$('scoreText').textContent='答對 '+right+' / '+index;$('progressBar').style.width=(index/5*100)+'%';$('unitText').textContent=item.u;$('questionText').textContent=item.q;$('explain').hidden=true;$('nextBtn').hidden=true;$('nextHint').hidden=true;const root=$('choices');root.innerHTML='';item.c.forEach((choice,i)=>{const b=document.createElement('button');b.type='button';b.className='choice';b.innerHTML='<b>'+letters[i]+'</b><span>'+esc(choice)+'</span>';b.onclick=()=>answer(i);root.appendChild(b);});}
function answer(picked){if(locked)return;locked=true;const item=questions[index],ok=picked===item.a;if(ok)right++;else wrong.push({item,picked});$('choices').querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add('correct');if(i===picked&&!ok)b.classList.add('wrong');});$('explain').className='explain'+(ok?'':' bad');$('verdict').textContent=ok?'答對':'答錯';$('answer').textContent='正解：('+letters[item.a]+') '+item.c[item.a];$('why').textContent=item.why;$('trap').textContent=item.trap;$('explain').hidden=false;$('nextBtn').hidden=false;$('nextBtn').textContent=index===4?'看成績':'下一題';$('nextHint').hidden=false;$('scoreText').textContent='答對 '+right+' / '+(index+1);$('progressBar').style.width=((index+1)/5*100)+'%';}
function next(){if(!locked)return;if(index===4){finish();return;}index++;render();window.scrollTo({top:0,behavior:'smooth'});}
function finish(){const score=Math.round(right/5*100);$('quiz').hidden=true;$('result').hidden=false;$('resultLabel').textContent=MORNING_QUIZ_BANK[subject].label+'・明早考前練習';$('rScore').textContent=score+'%';$('rLine').textContent=right+' / 5 題答對';$('rWrong').innerHTML=wrong.length?wrong.map(({item,picked})=>'<div class="wrong"><b>'+esc(item.u+'｜'+item.q)+'</b><span class="mine">你選：('+letters[picked]+') '+esc(item.c[picked])+'</span><span>正解：('+letters[item.a]+') '+esc(item.c[item.a])+'</span><span>'+esc(item.why)+'</span><span>最容易錯：'+esc(item.trap)+'</span></div>').join(''):'<div style="text-align:center;color:var(--label2);padding:8px">這科全部答對。</div>';try{localStorage.setItem('nx:score:'+scoreIds[subject],String(score));localStorage.setItem('nx:time:'+scoreIds[subject],String(Date.now()));}catch(error){}window.scrollTo({top:0});}
$('tabs').onclick=e=>{const b=e.target.closest('[data-subject]');if(b)choose(b.dataset.subject);};$('startBtn').onclick=start;$('nextBtn').onclick=next;$('retryBtn').onclick=start;$('changeBtn').onclick=()=>{$('result').hidden=true;$('quiz').hidden=true;$('setup').hidden=false;window.scrollTo({top:0});};document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('quiz').hidden&&locked){e.preventDefault();next();}});choose('chemistry');const session=await waitForSession();$('permissionLink').hidden=session.profile.role!=='admin';
</script></body></html>
