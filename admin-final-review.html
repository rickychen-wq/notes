<!DOCTYPE html>
<html lang="zh-Hant" data-admin-only="true" data-admin-fallback="index.html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>段考前最後複習</title>
<script>(function(){var t=null;try{t=localStorage.getItem('nx:theme');}catch(e){}if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--label2:#3c3c4399;--label3:#3c3c434d;--sep:#3c3c4326;--fill:#78788014;--blue:#0a84ff;--green:#34c759;--red:#ff3b30;--gold:#c8912b;--accent:#5b5bd6;--tint:#eeeeff;--shadow:0 7px 24px rgba(0,0,0,.09)}
html[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#7878805c;--green:#30d158;--red:#ff453a;--gold:#e8b73d;--accent:#a9a8ff;--tint:#272744;--shadow:0 8px 28px rgba(0,0,0,.46)}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#7878805c;--green:#30d158;--red:#ff453a;--gold:#e8b73d;--accent:#a9a8ff;--tint:#272744;--shadow:0 8px 28px rgba(0,0,0,.46)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue",sans-serif;font-size:17px;line-height:1.55;padding-bottom:calc(50px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.bar{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px 6px}.bar a{color:var(--blue);text-decoration:none;font-size:15px;font-weight:650}main{max-width:760px;margin:0 auto;padding:0 16px}.hero{padding:14px 2px 18px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}.hero h1{font-size:34px;line-height:1.12;letter-spacing:-1px;margin:5px 0 7px}.lead{margin:0;color:var(--label2);font-size:14px}.admin-pill{display:inline-flex;margin-top:11px;border-radius:999px;background:var(--tint);color:var(--accent);padding:4px 10px;font-size:11px;font-weight:850}
.card{background:var(--card);border:.5px solid var(--sep);border-radius:19px;box-shadow:var(--shadow);padding:16px;margin:11px 0}.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pick{position:relative;border:.5px solid var(--sep);border-radius:16px;background:var(--fill);padding:14px 12px;text-align:left;cursor:pointer;min-height:116px;overflow:hidden}.pick::after{content:"";position:absolute;right:-17px;top:-17px;width:55px;height:55px;border-radius:50%;background:var(--subject);opacity:.16}.pick[aria-pressed="true"]{border:1.5px solid var(--subject);background:color-mix(in srgb,var(--subject) 10%,var(--card))}.pick b{display:block;font-size:20px;letter-spacing:-.4px}.pick strong{display:block;margin-top:8px;color:var(--subject);font-size:25px;line-height:1}.pick span{display:block;margin-top:4px;color:var(--label2);font-size:11px;line-height:1.4}.scope{margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);color:var(--label2);font-size:13px}.scope b{color:var(--label)}.bigbtn{display:block;width:100%;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:800;padding:13px 16px;margin-top:13px;cursor:pointer}.bigbtn.sec{background:var(--fill);color:var(--label)}.bigbtn:disabled{opacity:.38}.progress-box{position:sticky;top:0;z-index:8;margin:0 -16px 13px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid var(--sep)}.progress-line{display:flex;justify-content:space-between;gap:10px;color:var(--label2);font-size:12px;font-weight:700}.track{height:6px;margin-top:8px;border-radius:999px;background:var(--fill);overflow:hidden}.track i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .3s ease}.unit{color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.04em}.question{font-size:21px;font-weight:800;line-height:1.42;letter-spacing:-.3px;margin-top:5px;white-space:pre-line}.choices{display:grid;gap:9px;margin-top:15px}.choice{display:flex;align-items:flex-start;gap:10px;width:100%;border:.5px solid var(--sep);border-radius:14px;background:var(--fill);padding:12px 13px;text-align:left;cursor:pointer;line-height:1.4}.choice b{flex:0 0 24px;color:var(--accent)}.choice.selected{border-color:var(--accent);background:var(--tint)}.choice.correct{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}.choice.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}.choice:disabled{opacity:1;color:var(--label)}.explain{margin-top:14px;border-left:4px solid var(--green);border-radius:0 14px 14px 0;background:var(--fill);padding:12px 13px}.explain.bad{border-left-color:var(--red)}.verdict{font-weight:850;color:var(--green)}.explain.bad .verdict{color:var(--red)}.correct-answer{font-weight:800;margin-top:3px}.reason{margin-top:9px;font-size:14px;color:var(--label2)}.trap{margin-top:9px;padding:9px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 13%,transparent);font-size:13px}.trap b{color:var(--gold)}.next-hint{text-align:center;color:var(--label3);font-size:11px;margin-top:7px}.score{text-align:center;padding:23px 8px 12px}.score-subject{font-size:13px;color:var(--accent);font-weight:850}.score-big{font-size:64px;font-weight:850;line-height:1;letter-spacing:-2.5px;margin-top:5px}.score-line{margin-top:8px;color:var(--label2);font-size:14px}.wrongrow{padding:13px 1px;border-bottom:.5px solid var(--sep)}.wrongrow:last-child{border-bottom:0}.wrongrow b{display:block}.wrongrow span{display:block;color:var(--label2);font-size:13px;margin-top:3px}.wrongrow .mine{color:var(--red)}.wrongrow .detail{margin-top:7px;line-height:1.5}.section-title{margin:24px 2px 8px;font-size:13px;color:var(--label2);font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions .bigbtn{margin-top:0}.loading{text-align:center;color:var(--label2);padding:40px 0}footer{text-align:center;color:var(--label3);font-size:12px;padding:29px 10px 0}@media(max-width:520px){.pick-grid{grid-template-columns:1fr}.pick{min-height:0;display:grid;grid-template-columns:1fr auto;align-items:center}.pick span{grid-column:1/-1}.question{font-size:19px}.actions{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="app-shell.css">
<script src="auth-prelude.js"></script>
<script type="module" src="auth-gate.js"></script>
</head>
<body>
<div class="bar"><a href="index.html">◀ 首頁</a></div>
<main>
  <header class="hero"><div class="eyebrow">Exam Night</div><h1>段考前最後複習</h1><p class="lead">固定範圍、平均分配；每題作答後立即看完整解析。</p><span class="admin-pill">ADMIN ONLY</span></header>
  <div class="loading" id="loading">正在確認管理員權限…</div>

  <section id="setup" hidden>
    <div class="card">
      <div class="pick-grid" id="subjectPicker">
        <button class="pick" type="button" data-subject="chemistry" style="--subject:#2f6f6b" aria-pressed="true"><b>化學</b><strong>23 題</strong><span>1-1～1-3、2-1～2-3</span></button>
        <button class="pick" type="button" data-subject="biology" style="--subject:#3f7a4a" aria-pressed="false"><b>生物</b><strong>27 題</strong><span>2-1、2-2、3-1、3-2</span></button>
        <button class="pick" type="button" data-subject="english" style="--subject:#3f5f9e" aria-pressed="false"><b>英文</b><strong>15 題</strong><span>課本、雜誌、4500 單</span></button>
      </div>
      <div class="scope" id="scopeText"><b>化學範圍：</b>1-1～1-3、2-1～2-3。各小節都有題目，不會只抽到同一章。</div>
      <button class="bigbtn" id="startBtn" type="button">開始化學複習</button>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="progress-box"><div class="progress-line"><span id="progressText">第 1 / 23 題</span><span id="liveScore">答對 0 / 0</span></div><div class="track"><i id="progressBar"></i></div></div>
    <div class="card">
      <div class="unit" id="unitText"></div>
      <div class="question" id="questionText"></div>
      <div class="choices" id="choiceRoot"></div>
      <div class="explain" id="explanation" hidden>
        <div class="verdict" id="verdict"></div>
        <div class="correct-answer" id="correctAnswer"></div>
        <div class="reason" id="reason"></div>
        <div class="trap"><b>容易錯：</b><span id="trapText"></span></div>
      </div>
      <button class="bigbtn" id="nextBtn" type="button" hidden>下一題</button>
      <div class="next-hint" id="nextHint" hidden>也可以按 Enter 繼續</div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="card score"><div class="score-subject" id="resultSubject"></div><div class="score-big" id="rScore">0%</div><div class="score-line" id="rLine">0 / 0 題答對</div></div>
    <div class="actions"><button class="bigbtn" id="againWrong" type="button">只重做錯題</button><button class="bigbtn sec" id="restartBtn" type="button">整份再做一次</button></div>
    <button class="bigbtn sec" id="changeBtn" type="button">換另一科</button>
    <div class="section-title" id="wrongTitle">錯題與完整解析</div>
    <div class="card" id="rWrong"></div>
  </section>

  <footer>這份是段考前快速確認用；答完再看解析，比先背答案有效。</footer>
</main>
<script type="module">
import {waitForSession} from './firebase-core.js';
import {FINAL_REVIEW_BANK} from './admin-final-review-data.js';

const $=function(id){return document.getElementById(id);};
const LETTERS=['A','B','C','D'];
const STORAGE_IDS={chemistry:'chem-final-review',biology:'bio-final-review',english:'en-final-review'};
const SCOPE_COPY={
  chemistry:'<b>化學範圍：</b>1-1～1-3、2-1～2-3。各小節都有題目，不會只抽到同一章。',
  biology:'<b>生物範圍：</b>2-1、2-2、3-1、3-2；不含小單元 5／3-3。會考構造、運輸與光合作用細節。',
  english:'<b>英文範圍：</b>課本 L1–L3、雜誌 U2／U4／U8／U10、4500 五回。以常考搭配和易混字為主。'
};
let subject='chemistry',questions=[],index=0,right=0,wrong=[],locked=false;

function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
function applyAccent(){document.documentElement.style.setProperty('--accent',FINAL_REVIEW_BANK[subject].accent);}
function chooseSubject(next){
  subject=next;applyAccent();
  document.querySelectorAll('[data-subject]').forEach(function(button){button.setAttribute('aria-pressed',String(button.dataset.subject===subject));});
  $('scopeText').innerHTML=SCOPE_COPY[subject];$('startBtn').textContent='開始'+FINAL_REVIEW_BANK[subject].label+'複習';
}
function begin(source){
  const bank=FINAL_REVIEW_BANK[subject];questions=(source||bank.questions).slice();index=0;right=0;wrong=[];locked=false;
  $('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;renderQuestion();window.scrollTo({top:0});
}
function renderQuestion(){
  const item=questions[index];locked=false;$('unitText').textContent=item.u;$('questionText').textContent=item.q;
  $('progressText').textContent='第 '+(index+1)+' / '+questions.length+' 題';$('liveScore').textContent='答對 '+right+' / '+index;
  $('progressBar').style.width=(index/questions.length*100)+'%';$('explanation').hidden=true;$('nextBtn').hidden=true;$('nextHint').hidden=true;
  const root=$('choiceRoot');root.innerHTML='';item.c.forEach(function(choice,choiceIndex){
    const button=document.createElement('button');button.type='button';button.className='choice';button.innerHTML='<b>'+LETTERS[choiceIndex]+'</b><span>'+escapeHtml(choice)+'</span>';
    button.addEventListener('click',function(){answer(choiceIndex);});root.appendChild(button);
  });
}
function answer(picked){
  if(locked)return;locked=true;const item=questions[index],ok=picked===item.a;if(ok)right++;else wrong.push({item,picked});
  $('choiceRoot').querySelectorAll('.choice').forEach(function(button,choiceIndex){button.disabled=true;if(choiceIndex===item.a)button.classList.add('correct');if(choiceIndex===picked&&choiceIndex!==item.a)button.classList.add('wrong');});
  $('explanation').className='explain'+(ok?'':' bad');$('verdict').textContent=ok?'答對':'答錯';
  $('correctAnswer').textContent='正解：('+LETTERS[item.a]+') '+item.c[item.a];$('reason').textContent=item.why;$('trapText').textContent=item.trap;
  $('explanation').hidden=false;$('nextBtn').hidden=false;$('nextBtn').textContent=index+1===questions.length?'看成績':'下一題';$('nextHint').hidden=false;
  $('liveScore').textContent='答對 '+right+' / '+(index+1);$('progressBar').style.width=((index+1)/questions.length*100)+'%';
}
function next(){if(!locked)return;if(index+1>=questions.length){finish();return;}index++;renderQuestion();window.scrollTo({top:0,behavior:'smooth'});}
function finish(){
  $('quiz').hidden=true;$('result').hidden=false;const score=Math.round(right/questions.length*100),bank=FINAL_REVIEW_BANK[subject];
  $('resultSubject').textContent=bank.label+'・段考前最後複習';$('rScore').textContent=score+'%';$('rLine').textContent=right+' / '+questions.length+' 題答對';
  $('againWrong').hidden=wrong.length===0;$('wrongTitle').textContent=wrong.length?'錯題與完整解析':'全部答對';
  const root=$('rWrong');root.innerHTML='';if(!wrong.length){root.innerHTML='<div style="text-align:center;color:var(--label2);padding:8px">這一科沒有錯題。</div>';}
  wrong.forEach(function(entry){const item=entry.item,row=document.createElement('div');row.className='wrongrow';row.innerHTML='<b>'+escapeHtml(item.u+'｜'+item.q)+'</b><span class="mine">你選：('+LETTERS[entry.picked]+') '+escapeHtml(item.c[entry.picked])+'</span><span>正解：('+LETTERS[item.a]+') '+escapeHtml(item.c[item.a])+'</span><span class="detail">'+escapeHtml(item.why)+'</span><span class="detail">容易錯：'+escapeHtml(item.trap)+'</span>';root.appendChild(row);});
  const id=STORAGE_IDS[subject];try{localStorage.setItem('nx:time:'+id,String(Date.now()));localStorage.setItem('nx:score:'+id,String(score));}catch(error){}
  window.scrollTo({top:0});
}
function retryWrong(){const items=wrong.map(function(entry){return entry.item;});if(items.length)begin(items);}
function resetSetup(){$('result').hidden=true;$('quiz').hidden=true;$('setup').hidden=false;window.scrollTo({top:0});}

$('subjectPicker').addEventListener('click',function(event){const button=event.target.closest('[data-subject]');if(button)chooseSubject(button.dataset.subject);});
$('startBtn').addEventListener('click',function(){begin();});$('nextBtn').addEventListener('click',next);$('againWrong').addEventListener('click',retryWrong);
$('restartBtn').addEventListener('click',function(){begin();});$('changeBtn').addEventListener('click',resetSetup);
document.addEventListener('keydown',function(event){if(event.key==='Enter'&&!$('quiz').hidden&&locked){event.preventDefault();next();}});

const session=await waitForSession();if(session.profile.role==='admin'){$('loading').hidden=true;$('setup').hidden=false;chooseSubject('chemistry');}
</script>
</body>
</html>
