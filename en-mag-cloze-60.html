<!DOCTYPE html>
<html lang="zh-Hant" data-admin-only="true" data-user-allow="78歲純情老少女" data-access-key="magClozeAllowedUids" data-admin-fallback="s-english.html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>雜誌四回克漏字 60 題 · 英文</title>
<script>(function(){var t=null;try{t=localStorage.getItem('nx:theme');}catch(e){}if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);})();</script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--label2:#3c3c4399;--label3:#3c3c434d;--sep:#3c3c4326;--fill:#78788014;--blue:#0a84ff;--green:#34c759;--red:#ff3b30;--gold:#c8912b;--accent:#3f5f9e;--accent2:#e9eff8;--shadow:0 6px 22px rgba(0,0,0,.09)}
html[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#7878805c;--green:#30d158;--red:#ff453a;--gold:#e8b73d;--accent:#8fb3e8;--accent2:#1c2a3c;--shadow:0 7px 26px rgba(0,0,0,.45)}
@media(prefers-color-scheme:dark){html:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--label:#fff;--label2:#ebebf599;--label3:#ebebf54d;--sep:#54545899;--fill:#7878805c;--green:#30d158;--red:#ff453a;--gold:#e8b73d;--accent:#8fb3e8;--accent2:#1c2a3c;--shadow:0 7px 26px rgba(0,0,0,.45)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue",sans-serif;font-size:17px;line-height:1.55;padding-bottom:calc(48px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}button{font:inherit;color:inherit}.bar{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 18px 7px}.bar a{color:var(--blue);text-decoration:none;font-size:15px;font-weight:650}main{max-width:760px;margin:0 auto;padding:0 16px}.hero{padding:12px 2px 16px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}h1{font-size:32px;line-height:1.14;letter-spacing:-.8px;margin:5px 0 7px}.lead{margin:0;color:var(--label2);font-size:14px}.admin-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.admin-pill{display:inline-flex;border-radius:999px;background:var(--accent2);color:var(--accent);padding:4px 9px;font-size:11px;font-weight:800;text-decoration:none}
.progress-box{position:sticky;top:0;z-index:8;margin:0 -16px 13px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:.5px solid var(--sep)}.progress-line{display:flex;justify-content:space-between;gap:10px;color:var(--label2);font-size:12px;font-weight:650}.track{height:6px;margin-top:8px;border-radius:999px;background:var(--fill);overflow:hidden}.track i{display:block;height:100%;width:0;border-radius:inherit;background:var(--accent);transition:width .25s ease}
.unit{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.08em}.article{font-size:20px;font-weight:800;line-height:1.25;margin-top:4px}.article-zh{font-size:13px;color:var(--label2);margin-top:2px}.passage-title{margin:18px 2px 8px;color:var(--label2);font-size:13px;font-weight:800}.card{background:var(--card);border:.5px solid var(--sep);border-radius:18px;box-shadow:var(--shadow);padding:16px;margin:10px 0}.text{white-space:pre-line;font-family:ui-serif,Georgia,"Times New Roman",serif;font-size:17px;line-height:1.72}.text mark{background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--label);border-radius:5px;padding:1px 3px;font-weight:750}
.question{padding:15px 1px;border-bottom:.5px solid var(--sep)}.question:last-child{border-bottom:0}.qhead{font-weight:800;margin-bottom:9px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.option{display:flex;align-items:flex-start;gap:8px;border:.5px solid var(--sep);border-radius:13px;background:var(--fill);padding:10px 11px;text-align:left;cursor:pointer;line-height:1.35}.option b{color:var(--accent)}.option.selected{border-color:var(--accent);background:var(--accent2)}.option.correct{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}.option.wrong{border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,var(--card))}.option:disabled{opacity:1;color:var(--label)}
.explain{margin-top:10px;border-left:3px solid var(--green);border-radius:0 12px 12px 0;background:var(--fill);padding:10px 12px}.explain.bad{border-left-color:var(--red)}.explain strong{display:block;font-size:13px;color:var(--green);margin-bottom:4px}.explain.bad strong{color:var(--red)}.explain .answer{font-weight:800}.explain p{margin:5px 0 0;color:var(--label2);font-size:14px}.bigbtn{display:block;width:100%;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:760;padding:13px 16px;margin-top:12px;cursor:pointer}.bigbtn.sec{background:var(--fill);color:var(--label)}.bigbtn:disabled{opacity:.4}.remain{text-align:center;color:var(--label2);font-size:12px;margin-top:8px}
.score{text-align:center;padding:24px 8px 13px}.score-big{font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px}.score-line{margin-top:9px;color:var(--label2);font-size:14px}.unit-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.unit-score{border-radius:12px;background:var(--fill);padding:9px 5px;text-align:center}.unit-score b{display:block;color:var(--accent)}.unit-score span{font-size:11px;color:var(--label2)}.wrongrow{padding:11px 1px;border-bottom:.5px solid var(--sep)}.wrongrow:last-child{border-bottom:0}.wrongrow b{display:block}.wrongrow span{display:block;color:var(--label2);font-size:13px;margin-top:3px}.wrongrow em{color:var(--red);font-style:normal}footer{text-align:center;color:var(--label3);font-size:12px;padding:30px 10px 0}@media(max-width:430px){.options{grid-template-columns:1fr}.article{font-size:18px}.text{font-size:16px}.unit-summary{grid-template-columns:1fr 1fr}}
</style>
<link rel="stylesheet" href="app-shell.css">
<script src="auth-prelude.js"></script>
<script type="module" src="auth-gate.js"></script>
</head>
<body>
<div class="bar"><a href="s-english.html">◀ 英文</a></div>
<main>
  <header class="hero"><div class="eyebrow">Magazine Cloze Review</div><h1>雜誌四回克漏字</h1><p class="lead">U2・U4・U8・U10｜12 篇、共 60 題｜每 5 題送出一次</p><div class="admin-actions"><span class="admin-pill">限定開放</span><a id="permissionLink" class="admin-pill" href="access-admin.html?target=cloze" hidden>＋ 開放權限</a></div></header>
  <div id="quizPlay" hidden>
    <div class="progress-box"><div class="progress-line"><span id="groupProgress">第 1 / 12 組</span><span id="scoreProgress">答對 0 / 0</span></div><div class="track"><i id="progressBar"></i></div></div>
    <section id="passageHead"></section>
    <div class="passage-title" id="passageTitle"></div>
    <div class="card text" id="passageText"></div>
    <div class="card" id="questionRoot"></div>
    <button class="bigbtn" id="submitGroup" type="button" disabled>送出這 5 題</button>
    <div class="remain" id="remainText">還差 5 題</div>
    <button class="bigbtn" id="nextGroup" type="button" hidden>下一組 5 題</button>
  </div>
  <div id="quizDone" hidden>
    <div class="card"><div class="score"><div class="score-big" id="resultScore">0%</div><div class="score-line" id="resultLine"></div><div class="unit-summary" id="unitSummary"></div></div></div>
    <h2 class="passage-title" id="wrongTitle" hidden>答錯的題目</h2><div class="card" id="wrongList" hidden></div>
    <button class="bigbtn" id="restartQuiz" type="button">重新作答 60 題</button>
  </div>
  <div class="card" id="loading">正在載入 60 題…</div>
  <footer>題目、答案與解析依照今日列印版 PDF</footer>
</main>
<script type="module">
import {waitForSession} from './firebase-core.js';
import {MAG_CLOZE_SETS} from './en-mag-cloze-60-data.js';

const $=function(id){return document.getElementById(id);};
const LETTERS=['A','B','C','D'];
let groupIndex=0,selections=new Map(),right=0,answered=0,wrong=[],locked=false,unitScores={};

function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,function(char){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});}
function passageHtml(text){return escapeHtml(text).replace(/\((\d+)\) ________/g,'<mark>($1) ________</mark>');}
function renderGroup(){
  locked=false;selections=new Map();const set=MAG_CLOZE_SETS[groupIndex];$('groupProgress').textContent='第 '+(groupIndex+1)+' / '+MAG_CLOZE_SETS.length+' 組';$('scoreProgress').textContent='答對 '+right+' / '+answered;$('progressBar').style.width=(groupIndex/MAG_CLOZE_SETS.length*100)+'%';
  $('passageHead').innerHTML='<div class="unit">'+escapeHtml(set.unit)+'</div><div class="article">'+escapeHtml(set.article)+'</div><div class="article-zh">'+escapeHtml(set.zh)+'</div>';$('passageTitle').textContent=set.passage;$('passageText').innerHTML=passageHtml(set.text);
  const root=$('questionRoot');root.innerHTML='';set.questions.forEach(function(question){
    const row=document.createElement('section');row.className='question';row.dataset.number=String(question[0]);const head=document.createElement('div');head.className='qhead';head.textContent='第 '+question[0]+' 題';const options=document.createElement('div');options.className='options';
    question[1].forEach(function(choice,index){const button=document.createElement('button');button.type='button';button.className='option';button.dataset.index=String(index);button.innerHTML='<b>('+LETTERS[index]+')</b><span>'+escapeHtml(choice)+'</span>';button.addEventListener('click',function(){if(locked)return;selections.set(question[0],index);options.querySelectorAll('.option').forEach(function(item){item.classList.toggle('selected',item===button);});updateReady();});options.appendChild(button);});
    row.append(head,options);root.appendChild(row);
  });
  $('submitGroup').hidden=false;$('submitGroup').disabled=true;$('nextGroup').hidden=true;updateReady();window.scrollTo({top:0});
}
function updateReady(){const left=5-selections.size;$('remainText').textContent=left?'還差 '+left+' 題':'五題都選好了';$('remainText').hidden=false;$('submitGroup').disabled=left!==0;}
function submitGroup(){
  if(locked||selections.size!==5)return;locked=true;const set=MAG_CLOZE_SETS[groupIndex];set.questions.forEach(function(question){
    const picked=selections.get(question[0]),ok=picked===question[2];answered++;if(ok)right++;else wrong.push({unit:set.unit,number:question[0],mine:LETTERS[picked]+' '+question[1][picked],answer:LETTERS[question[2]]+' '+question[3],explanation:question[4]});
    if(!unitScores[set.unit])unitScores[set.unit]={right:0,total:0};unitScores[set.unit].total++;if(ok)unitScores[set.unit].right++;
    const row=$('questionRoot').querySelector('[data-number="'+question[0]+'"]'),buttons=row.querySelectorAll('.option');buttons.forEach(function(button,index){button.disabled=true;button.classList.remove('selected');if(index===question[2])button.classList.add('correct');if(index===picked&&!ok)button.classList.add('wrong');});
    const explain=document.createElement('div');explain.className='explain'+(ok?'':' bad');explain.innerHTML='<strong>'+(ok?'答對':'答錯')+'</strong><div>你選：('+LETTERS[picked]+') '+escapeHtml(question[1][picked])+'</div><div class="answer">正解：('+LETTERS[question[2]]+') '+escapeHtml(question[3])+'</div><p>'+escapeHtml(question[4])+'</p>';row.appendChild(explain);
  });
  $('scoreProgress').textContent='答對 '+right+' / '+answered;$('submitGroup').hidden=true;$('remainText').hidden=true;$('nextGroup').hidden=false;$('nextGroup').textContent=groupIndex+1===MAG_CLOZE_SETS.length?'看總成績':'下一組 5 題';
}
function nextGroup(){if(!locked)return;if(groupIndex+1>=MAG_CLOZE_SETS.length){finish();return;}groupIndex++;renderGroup();}
function finish(){
  $('quizPlay').hidden=true;$('quizDone').hidden=false;const score=Math.round(right/60*100);$('resultScore').textContent=score+'%';$('resultLine').textContent=right+' / 60 題答對';$('unitSummary').innerHTML='';['U2','U4','U8','U10'].forEach(function(unit){const data=unitScores[unit]||{right:0,total:15},box=document.createElement('div');box.className='unit-score';box.innerHTML='<b>'+unit+'</b><span>'+data.right+' / '+data.total+'</span>';$('unitSummary').appendChild(box);});
  const list=$('wrongList');list.innerHTML='';if(wrong.length){$('wrongTitle').hidden=false;list.hidden=false;wrong.forEach(function(item){const row=document.createElement('div');row.className='wrongrow';row.innerHTML='<b>'+escapeHtml(item.unit+' 第 '+item.number+' 題')+'</b><span>你選：<em>'+escapeHtml(item.mine)+'</em></span><span>正解：'+escapeHtml(item.answer)+'</span><span>'+escapeHtml(item.explanation)+'</span>';list.appendChild(row);});}else{$('wrongTitle').hidden=true;list.hidden=true;}
  try{const key='nx:score:en-mag-cloze-60',old=Number(localStorage.getItem(key)||0);localStorage.setItem(key,String(Math.max(old,score)));localStorage.setItem('nx:time:en-mag-cloze-60',String(Date.now()));}catch(error){}window.scrollTo({top:0});
}
function restart(){groupIndex=0;selections=new Map();right=0;answered=0;wrong=[];locked=false;unitScores={};$('quizDone').hidden=true;$('quizPlay').hidden=false;renderGroup();}
$('submitGroup').addEventListener('click',submitGroup);$('nextGroup').addEventListener('click',nextGroup);$('restartQuiz').addEventListener('click',restart);document.addEventListener('keydown',function(event){if(event.key!=='Enter'||$('quizPlay').hidden)return;if(!locked&&selections.size===5){event.preventDefault();submitGroup();}else if(locked){event.preventDefault();nextGroup();}});
(async function(){const session=await waitForSession();$('permissionLink').hidden=session.profile.role!=='admin';$('loading').hidden=true;$('quizPlay').hidden=false;renderGroup();})();
</script>
</body>
</html>
