<!DOCTYPE html>
<html lang="zh-Hant" data-content-state="preparing">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>段考複習</title>
<script>
(function(){
  var k='nx:theme';
  var t=null; try{ t=localStorage.getItem(k); }catch(e){}
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t);
  window.nxSetTheme=function(v){
    try{ v==='system' ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){}
    if(v==='system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',v);
    if(window.nxSyncTheme) window.nxSyncTheme();
  };
  window.nxTheme=function(){ try{ return localStorage.getItem(k)||'system'; }catch(e){ return 'system'; } };
  try{ localStorage.removeItem('nx:hide'); }catch(e){}
})();
</script>
<style>
  :root{
    --bg:#f2f2f7;--bg2:#ffffff;--card:#ffffff;--label:#000000;--label2:#3c3c4399;
    --label3:#3c3c434d;--sep:#3c3c4326;--fill:#78788014;--blue:#0a84ff;--gold:#c8912b;
    --shadow:0 6px 22px rgba(0,0,0,.10);--ring:rgba(0,0,0,.06);
  }
  html[data-theme="dark"]{
    --bg:#0b0b0d;--bg2:#141416;--card:#1c1c1e;--label:#ffffff;--label2:#ebebf599;
    --label3:#ebebf54d;--sep:#54545866;--fill:#7878802e;--blue:#0a84ff;--gold:#e8b73d;
    --shadow:0 6px 24px rgba(0,0,0,.5);--ring:rgba(255,255,255,.08);
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --bg:#0b0b0d;--bg2:#141416;--card:#1c1c1e;--label:#ffffff;--label2:#ebebf599;
      --label3:#ebebf54d;--sep:#54545866;--fill:#7878802e;--blue:#0a84ff;--gold:#e8b73d;
      --shadow:0 6px 24px rgba(0,0,0,.5);--ring:rgba(255,255,255,.08);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--label);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Helvetica Neue",sans-serif;
    font-size:17px;line-height:1.5;
    padding:0 0 calc(40px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  main{max-width:720px;margin:0 auto;padding:0 18px}

  /* 進場動畫 */
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .rise{opacity:0;animation:rise .5s cubic-bezier(.22,1,.36,1) forwards}
  @media (prefers-reduced-motion: reduce){ .rise{animation:none;opacity:1} }

  /* 背景光暈 */
  .glow{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .glow i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.30;
    animation:float 16s ease-in-out infinite alternate}
  html[data-theme="dark"] .glow i{opacity:.22}
  @keyframes float{from{transform:translate(0,0) scale(1)}to{transform:translate(18px,-22px) scale(1.12)}}

  .pressable{transition:transform .16s cubic-bezier(.22,1,.36,1)}
  .pressable:active{transform:scale(.975)}

  .top{padding:calc(env(safe-area-inset-top) + 46px) 0 6px}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.16em;color:var(--label3);text-transform:uppercase}
  h1{font-size:40px;font-weight:800;letter-spacing:-1.4px;margin:8px 0 6px;line-height:1.08}
  .lead{font-size:15px;color:var(--label2);margin:0}
  .stat{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-size:13px;color:var(--label2)}
  .statbar{flex:1;height:6px;border-radius:4px;background:var(--fill);overflow:hidden}
  .statbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#34c759,#0a84ff);
    width:0;transition:width 1.1s cubic-bezier(.22,1,.36,1)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0 0}
  .sub{position:relative;display:block;background:var(--card);border-radius:18px;padding:16px 15px 14px;
    box-shadow:var(--shadow);overflow:hidden;border:.5px solid var(--ring)}
  .sub::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--c)}
  .sub::after{content:"";position:absolute;right:-26px;top:-26px;width:78px;height:78px;border-radius:50%;
    background:var(--c);opacity:.14;filter:blur(6px)}
  .sub .nm{font-size:22px;font-weight:800;letter-spacing:-.5px}
  .sub .en{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--c);text-transform:uppercase;margin-top:1px}
  .sub .ds{font-size:12.5px;color:var(--label2);margin-top:8px;min-height:32px;line-height:1.45}
  .sub .pg{display:flex;align-items:center;gap:7px;margin-top:10px}
  .sub .pgbar{flex:1;height:4px;border-radius:3px;background:var(--fill);overflow:hidden}
  .sub .pgbar i{display:block;height:100%;background:var(--c);width:0;border-radius:3px;
    transition:width .9s cubic-bezier(.22,1,.36,1)}
  .sub .pgn{font-size:11px;font-weight:700;color:var(--label3);font-variant-numeric:tabular-nums}

  h2.sec{font-size:12px;font-weight:700;color:var(--label3);letter-spacing:.1em;margin:34px 0 10px;
    text-transform:uppercase}
  .panel{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
    border:.5px solid var(--ring)}
  .prow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;
    border-top:.5px solid var(--sep)}
  .prow:first-child{border-top:none}
  .prow .lb{font-size:15px}
  .prow .lb small{display:block;font-size:12px;color:var(--label2);margin-top:1px}
  .seg{display:flex;gap:2px;padding:2px;background:var(--fill);border-radius:9px}
  .seg button{border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:600;
    color:var(--label);padding:6px 12px;border-radius:7px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.16)}
  .account-card{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:12px;margin:20px 0 4px}
  .account-main,.account-metric{background:var(--card);border:.5px solid var(--ring);border-radius:18px;box-shadow:var(--shadow)}
  .account-main{padding:17px}.account-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .account-hello{font-size:20px;font-weight:800;letter-spacing:-.4px}.account-copy{margin-top:4px;color:var(--label2);font-size:12.5px}
  .account-role{padding:4px 8px;border-radius:999px;background:var(--fill);color:var(--label2);font-size:10px;font-weight:800}
  .account-links{display:flex;gap:8px;margin-top:14px}.account-links a{flex:1;padding:9px 10px;border-radius:11px;background:var(--fill);
    color:var(--blue);font-size:13px;font-weight:750;text-align:center}.account-metric{display:flex;flex-direction:column;justify-content:center;padding:17px}
  .account-metric b{font-size:25px;letter-spacing:-.7px}.account-metric span{margin-top:3px;color:var(--label2);font-size:12px}
  .empty-state{position:relative;overflow:hidden;margin:18px 0 0;padding:25px 22px 24px;border:.5px solid var(--ring);
    border-radius:22px;background:var(--card);box-shadow:var(--shadow);text-align:center}
  .empty-state::before{content:"";position:absolute;inset:0 0 auto;height:4px;
    background:linear-gradient(90deg,#7a4a9e,#3f5f9e,#2f7a5f)}
  .empty-state__icon{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 13px;border-radius:17px;
    background:var(--fill);font-size:25px}
  .empty-state h2{margin:0;font-size:23px;letter-spacing:-.45px}
  .empty-state p{max-width:430px;margin:7px auto 0;color:var(--label2);font-size:14px;line-height:1.65}
  .empty-state__tag{display:inline-block;margin-top:15px;padding:6px 10px;border-radius:999px;background:var(--fill);
    color:var(--label2);font-size:11px;font-weight:800;letter-spacing:.08em}
  @media(max-width:520px){.account-card{grid-template-columns:1fr}.account-metric{flex-direction:row;align-items:center;justify-content:space-between;padding:14px 17px}.account-metric b{font-size:20px}.account-metric span{margin-top:0}}
  footer{text-align:center;font-size:12px;color:var(--label3);padding:34px 18px 0;line-height:1.7}
</style>

<link rel="stylesheet" href="app-shell.css">
<script src="auth-prelude.js"></script>
<script type="module" src="auth-gate.js"></script>
</head>
<body>

<div class="glow"><i style="background:#2f7a5f;width:200px;height:200px;left:0%;top:0%;animation-delay:0s"></i><i style="background:#3f5f9e;width:270px;height:270px;left:23%;top:31%;animation-delay:1s"></i><i style="background:#7a4a9e;width:340px;height:340px;left:46%;top:62%;animation-delay:2s"></i><i style="background:#3f7a4a;width:200px;height:200px;left:69%;top:23%;animation-delay:3s"></i><i style="background:#2f6f6b;width:270px;height:270px;left:12%;top:54%;animation-delay:4s"></i></div>
<main>
  <div class="top">
    <div class="eyebrow rise" style="animation-delay:40ms">115-1 第二次段考</div>
    <h1 class="rise" style="animation-delay:80ms">段考複習</h1>
    <p class="lead rise" style="animation-delay:110ms">新的範圍與複習內容正在整理。</p>
  </div>

  <section class="account-card rise" style="animation-delay:135ms" aria-label="帳戶摘要">
    <div class="account-main">
      <div class="account-top"><div><div class="account-hello" id="homeGreeting">載入帳戶…</div><div class="account-copy" id="homeSummary">正在同步你的學習狀況</div></div><span class="account-role" id="homeRole">學習者</span></div>
      <div class="account-links"><a href="me.html">我的學習狀況</a><a href="manage.html" id="manageLink" hidden>管理中心</a></div>
    </div>
    <div class="account-metric"><b id="homeMetric">—</b><span id="homeMetricLabel">最近 7 天閱讀</span></div>
  </section>

  <section class="empty-state rise" style="animation-delay:180ms" aria-label="第二次段考準備狀態">
    <div class="empty-state__icon" aria-hidden="true">✦</div>
    <h2>第二次段考準備中</h2>
    <p>目前還沒有開放的科目與複習內容。範圍確認後，新的筆記與測驗會從這裡陸續上線。</p>
    <span class="empty-state__tag">CONTENT IN PROGRESS</span>
  </section>

  <h2 class="sec rise" style="animation-delay:560ms">設定</h2>
  <div class="panel rise" style="animation-delay:600ms">
    <div class="prow">
      <div class="lb">外觀<small>亮色 · 暗色 · 跟隨系統</small></div>
      <div class="seg" id="segTheme">
        <button data-v="system">系統</button><button data-v="light">亮</button><button data-v="dark">暗</button>
      </div>
    </div>
  </div>

  <footer>
    第一次段考內容已封存，帳號與學習紀錄完整保留。<br>
    第二次段考內容正在準備中。
  </footer>
</main>

<script>
function syncSeg(){ var v=nxTheme();
  document.querySelectorAll('#segTheme button').forEach(function(b){
    b.setAttribute('aria-pressed', String(b.dataset.v===v)); }); }
document.getElementById('segTheme').addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return; nxSetTheme(b.dataset.v); syncSeg(); });
syncSeg();

</script>
<script type="module" src="home.js"></script>
</body>
</html>
